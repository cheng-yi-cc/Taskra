name: Release APK + Website

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Release tag（如 v1.0.1；留空则自动取最新 Release）"
        required: false
        default: ""
      rebuild_apk:
        description: "是否重新编译并覆盖 Release APK（默认 false，直接复用已有 Release 安装包重部署官网）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.rebuild_apk == true
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/taskra-release.jks
          echo "TASKRA_KEYSTORE_FILE=/tmp/taskra-release.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          TASKRA_KEYSTORE_FILE: ${{ env.TASKRA_KEYSTORE_FILE }}
          TASKRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASKRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASKRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare artifacts
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK"
          mkdir -p dist
          cp "$APK" "dist/taskra-${TAG}.apk"
          cp "$APK" dist/taskra-latest.apk
          (cd dist && sha256sum "taskra-${TAG}.apk" > "taskra-${TAG}.apk.sha256")

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/taskra-${{ env.TAG }}.apk
            dist/taskra-latest.apk
            dist/taskra-${{ env.TAG }}.apk.sha256
          generate_release_notes: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.TAG }}
          path: dist/

  deploy-pages:
    needs: build-release
    if: always() && (needs.build-release.result == 'success' || needs.build-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Download newly built APK artifact
        if: needs.build-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ steps.resolve.outputs.tag }}
          path: dist/

      - name: Download existing GitHub Release APK
        if: needs.build-release.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist --clobber
          if [ -f "dist/taskra-${TAG}.apk" ] && [ ! -f "dist/taskra-latest.apk" ]; then
            cp "dist/taskra-${TAG}.apk" dist/taskra-latest.apk
          fi
          if [ -f "dist/taskra-${TAG}.apk" ] && [ ! -f "dist/taskra-${TAG}.apk.sha256" ]; then
            (cd dist && sha256sum "taskra-${TAG}.apk" > "taskra-${TAG}.apk.sha256")
          fi

      - name: Assemble site bundle
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          mkdir -p deploy
          cp -r site/. deploy/
          cp "dist/taskra-${TAG}.apk" deploy/
          cp dist/taskra-latest.apk deploy/
          cp "dist/taskra-${TAG}.apk.sha256" deploy/ 2>/dev/null || true
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="$(cut -d ' ' -f1 < "dist/taskra-${TAG}.apk.sha256" 2>/dev/null || true)"
          cat > deploy/version.json <<EOF
          {
            "version": "${TAG}",
            "apk": "taskra-${TAG}.apk",
            "latest": "taskra-latest.apk",
            "githubApk": "https://github.com/${REPO}/releases/download/${TAG}/taskra-${TAG}.apk",
            "sha256": "${SHA}",
            "updated": "${DATE}",
            "releaseUrl": "https://github.com/${REPO}/releases/tag/${TAG}"
          }
          EOF
          ls -lh deploy/

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=taskra --branch=main --commit-dirty=true
